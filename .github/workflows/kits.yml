name: Kits

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kits-${{ github.ref }}

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # Each architecture builds on its own native runner. Pull requests only build.
  build:
    strategy:
      fail-fast: false
      matrix:
        kit: [nix, jj]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The docker-container driver keeps the kit descriptor annotation.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: ${{ matrix.kit }}
          file: ${{ matrix.kit }}/${{ matrix.kit }}.yaml
          platforms: linux/${{ matrix.arch }}
          provenance: mode=min
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0}/sbx-kit-{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, matrix.kit) || 'type=cacheonly' }}
      - name: Record the digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.kit }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  merge:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    strategy:
      matrix:
        kit: [nix, jj]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.kit }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the architectures into one tag
        working-directory: digests
        env:
          IMAGE: ${{ env.REGISTRY }}/sbx-kit-${{ matrix.kit }}
        run: |
          printf "$IMAGE@sha256:%s\n" * | xargs docker buildx imagetools create \
            -t "$IMAGE:latest" -t "$IMAGE:$GITHUB_SHA"

  # A set merges published kits and runs nothing, so one runner covers both
  # architectures.
  set:
    needs: merge
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      TCK_VERSION: 3.0.0-m.13
      TCK_SHA256: 9aaf699a662e55c35a2930dd4778a7f4e2317b563d64cc9d21622e6bac6f744c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: nix-jj
          file: nix-jj/nix-jj.yaml
          platforms: linux/amd64,linux/arm64
          provenance: mode=min
          push: true
          build-args: |
            registry=${{ env.REGISTRY }}
            tag=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/sbx-kit-nix-jj:latest
            ${{ env.REGISTRY }}/sbx-kit-nix-jj:${{ github.sha }}
      - name: Check the published kits
        run: |
          file="kit-tck_${TCK_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/docker/sandbox-kit-spec/releases/download/v${TCK_VERSION}/$file"
          echo "$TCK_SHA256  $file" | sha256sum -c -
          tar -xzf "$file" kit-tck
          for kit in nix jj nix-jj; do
            ./kit-tck validate "$REGISTRY/sbx-kit-$kit:$GITHUB_SHA"
          done
